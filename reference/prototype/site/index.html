<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бюджет на светло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --sunk:#EEF2F6; --ink:#15202B; --muted:#586575; --line:#DAE1E8;
  --accent:#E3A008; --accent-soft:#FDF3D7; --accent-ink:#7A5300;
  --data:#2F5D9A; --data-2:#9DB9DD; --data-3:#C9D6E6;
  --rev:#2F5D9A; --exp:#C4532C; /* приходи / разходи в графиката за изпълнението */
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --warn:#A8670A; --warn-soft:#FBEFD9; --unk:#8A5A6B; --unk-soft:#F4E8EC; --part:#2F5D9A; --part-soft:#E4ECF7;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 16px rgba(21,32,43,.06);
  --display:"Sofia Sans Condensed","Sofia Sans","Arial Narrow",system-ui,sans-serif;
  --body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E141B; --surface:#151E28; --sunk:#1B2632; --ink:#E6EDF3; --muted:#9AA8B6; --line:#283543;
    --accent:#F2B92E; --accent-soft:#3A2F12; --accent-ink:#F5CB64;
    --data:#7FA8E0; --data-2:#3F6497; --data-3:#2A3D57;
    --rev:#5B8FDB; --exp:#D96C45;
    --ok:#6CC08F; --ok-soft:#173226; --warn:#E3A94A; --warn-soft:#3A2C12; --unk:#D59AAE; --unk-soft:#3A2230; --part:#8DB3E6; --part-soft:#18283B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E141B; --surface:#151E28; --sunk:#1B2632; --ink:#E6EDF3; --muted:#9AA8B6; --line:#283543;
  --accent:#F2B92E; --accent-soft:#3A2F12; --accent-ink:#F5CB64;
  --data:#7FA8E0; --data-2:#3F6497; --data-3:#2A3D57;
  --rev:#5B8FDB; --exp:#D96C45;
  --ok:#6CC08F; --ok-soft:#173226; --warn:#E3A94A; --warn-soft:#3A2C12; --unk:#D59AAE; --unk-soft:#3A2230; --part:#8DB3E6; --part-soft:#18283B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.2vw,2.9rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.01em}
.brand-mark{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF6D8 0,var(--accent) 55%,#B57A00 100%);box-shadow:0 0 0 4px var(--accent-soft)}
.demo-pill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.spacer{flex:1}
.src-toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:600}
.src-toggle .dot{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.src-toggle .dot::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .2s}
.src-toggle[aria-pressed="true"] .dot{background:var(--accent)}
.src-toggle[aria-pressed="true"] .dot::after{transform:translateX(12px)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1320px;margin:0 auto}
.nav{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto;padding:18px 14px 30px;border-right:1px solid var(--line)}
.nav a{display:block;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--muted);line-height:1.3}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.nav .group{margin:14px 12px 6px}
.nav .phase{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
main{padding:28px clamp(16px,3vw,40px) 90px;min-width:0}
.page{max-width:1040px;display:grid;gap:28px}
.lede{font-size:1.15rem;max-width:62ch}
.tabbar{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .nav{display:none}
  .demo-pill{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;text-align:center;text-decoration:none;font-size:.78rem;font-weight:600;color:var(--muted);padding:8px 4px;border-radius:8px}
  .tabbar a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
  .topbar{padding:10px 16px}
  .src-toggle span.lbl{display:none}
}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid-3,.grid-2,.grid-4{grid-template-columns:1fr}#expChartWrap{grid-template-columns:1fr!important}}
.kpi .label{font-size:.9rem;color:var(--muted);font-weight:600}
.kpi .value{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .value small{font-size:1rem;font-weight:700;margin-left:4px}
.kpi .sub{font-size:.9rem;color:var(--muted);margin-top:6px}
.sentence{font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,2.9vw,2.05rem);line-height:1.25;max-width:34ch}
.sentence b{color:var(--accent-ink);font-weight:800;white-space:nowrap}
.scope{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 8px}

/* progress */
.prog{display:grid;gap:14px}
.prog-row{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:12px;align-items:center}
.bar{position:relative;height:14px;background:var(--sunk);border-radius:7px;overflow:visible}
.bar > i{position:absolute;inset:0 auto 0 0;background:var(--data);border-radius:7px}
.bar .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--accent)}
.bar .mark span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.72rem;font-weight:700;color:var(--accent-ink);white-space:nowrap}
.prog-row .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.prog-row.eur{grid-template-columns:110px minmax(0,1fr) auto}
.prog-row .pct small{font-weight:600;color:var(--muted)}
.bar > i.plan{background:var(--data-2)}

/* question cards */
.qcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.qcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.qcards{grid-template-columns:1fr}}
.qcard{display:grid;gap:4px;text-decoration:none;padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,transform .15s}
.qcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.qcard b{font-family:var(--display);font-size:1.15rem}
.qcard span{font-size:.9rem;color:var(--muted)}
.qcard.p2{opacity:.6}

/* source badges */
.src{display:none;margin:-4px 0 12px;font-size:.82rem;line-height:1.35;padding:6px 10px;border-radius:6px;border-left:3px solid}
body.show-src .src{display:flex;gap:8px;align-items:flex-start}
.src b{white-space:nowrap}
.src span{min-width:0;overflow-wrap:anywhere}
.src[data-st="ok"]{background:var(--ok-soft);border-color:var(--ok)}
.src[data-st="ok"] b{color:var(--ok)}
.src[data-st="warn"]{background:var(--warn-soft);border-color:var(--warn)}
.src[data-st="warn"] b{color:var(--warn)}
.src[data-st="unk"]{background:var(--unk-soft);border-color:var(--unk)}
.src[data-st="unk"] b{color:var(--unk)}
.src[data-st="part"]{background:var(--part-soft);border-color:var(--part)}
.src[data-st="part"] b{color:var(--part)}
.st{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.unk{background:var(--unk-soft);color:var(--unk)}
.st.part{background:var(--part-soft);color:var(--part)}

/* charts & tables */
.chart{width:100%;height:340px}
.chart.tall{height:420px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td:first-child{padding-left:28px;color:var(--muted)}
.hbar{height:8px;background:var(--sunk);border-radius:4px;margin-top:6px;min-width:60px}
.hbar i{display:block;height:100%;background:var(--data);border-radius:4px}

/* stacked 100 bar */
.stack{display:flex;height:48px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.stack > div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

details.row{border-bottom:1px solid var(--line);padding:10px 0}
details.row summary{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:baseline;list-style:none;font-weight:600}
details.row summary::-webkit-details-marker{display:none}
details.row summary::before{content:"▸";color:var(--muted);margin-right:6px;display:inline-block;transition:transform .15s}
details.row[open] summary::before{transform:rotate(90deg)}
details.row .body{padding:8px 0 4px 18px;color:var(--muted);display:grid;gap:4px;max-width:70ch}

/* list rows (ministries) */
.search{width:100%;max-width:380px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mlist{display:grid}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:4px 16px;padding:10px 4px;border-bottom:1px solid var(--line);text-decoration:none;align-items:center}
.mrow:hover{background:var(--sunk)}
.mrow .nm{font-weight:600}
.mrow .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mrow .hbar{grid-column:1 / -1;margin-top:0}
.mrow .tag{font-size:.75rem;color:var(--muted);font-weight:600}

/* calculator */
.calc{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.calc{grid-template-columns:1fr}}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:.92rem}
.field input[type="number"]{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:1.1rem;font-variant-numeric:tabular-nums;width:100%}
.radio{display:grid;gap:6px}
.radio label{display:flex;gap:8px;align-items:center;font-weight:500}
.radio label.off{color:var(--muted)}
.receipt{font-family:var(--body)}
.receipt .line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.receipt .line b{font-variant-numeric:tabular-nums}
.receipt .total{font-family:var(--display);font-size:1.6rem;font-weight:800}
.share{border:1px solid var(--line);border-radius:12px;padding:18px;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.share p{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.3}

/* map */
.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.mapgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.mapgrid{grid-template-columns:1fr}}
.mapcard{display:grid;gap:8px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.mapcard:hover{border-color:var(--accent)}
.mapcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mapcard b{font-family:var(--display);font-size:1.1rem}
.mapcard .kind{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mapcard .st-row{display:flex;gap:6px;flex-wrap:wrap}
ol.qs{margin:0;padding-left:22px;display:grid;gap:8px;max-width:75ch}
.note{font-size:.88rem;color:var(--muted);max-width:75ch}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0;max-width:75ch}
.p2box{border:1px dashed var(--line);border-radius:12px;padding:24px;background:var(--sunk)}

/* разбивка на функциите и „По години“ */
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-height:34px;margin-bottom:8px;font-size:.9rem}
.crumb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:.86rem}
.crumb:hover{border-color:var(--accent)}
.crumb-here{font-weight:700}
.part{padding:8px 0;border-bottom:1px dashed var(--line)}
.part .line{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.part .line b{white-space:nowrap;font-variant-numeric:tabular-nums}
.part .hbar{margin-top:5px}
.psub{font-size:.82rem;color:var(--muted);margin-top:3px}
.xbtn{display:inline-flex;gap:6px;align-items:baseline;border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600}
.xbtn .tw{color:var(--muted);display:inline-block;width:12px}
.xpad{display:inline-block;padding-left:18px}
.linkish{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--accent)}
.yr-controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.sel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;max-width:100%}
.yr-sum{font-size:1.02rem;max-width:70ch}
table.yr-table{font-size:.88rem}
table.yr-table th,table.yr-table td{padding:7px 8px}
tr.on td{background:var(--accent-soft)}

/* изпълнение по месеци */
details.tbl{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.tbl summary{cursor:pointer;font-weight:600;list-style:none;width:fit-content}
details.tbl summary::-webkit-details-marker{display:none}
details.tbl summary::before{content:"▸";color:var(--muted);margin-right:6px;display:inline-block;transition:transform .15s}
details.tbl[open] summary::before{transform:rotate(90deg)}
details.tbl .table-wrap{margin-top:8px}
details.tbl td .psub{margin-top:1px}
tr.plan td{border-bottom:0;border-top:2px solid var(--line)}
tr.y26 td{border-bottom:0;padding-bottom:2px}
tr.y25 td{color:var(--muted);padding-top:2px}
@media (max-width:560px){details.tbl th,details.tbl td{padding-left:5px;padding-right:5px}details.tbl tr>:first-child{padding-left:0}details.tbl tr>:last-child{padding-right:0}}
/* приходи и разходи една до друга (на тесен екран — една под друга); легенда над графиките */
.exm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 28px}
.exm .psub{margin:2px 0 0}
.exm .chart{height:280px}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:.86rem;margin:14px 0 12px}
.lg span{display:inline-flex;align-items:center;gap:3px}
.lg i{display:inline-block;width:14px;border-top:3px solid var(--ink)}
.lg i.d{width:18px;border-top-width:2px;border-top-style:dashed}
.lg i.sw{width:10px;height:10px;border:0;border-radius:2px;background:var(--muted)}
.lg i.sw.g{background:transparent;border:1.5px dashed var(--muted)}
.lg i:last-of-type{margin-right:4px}

/* тип потребител */
[hidden]{display:none!important}
.utype-pick{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;white-space:nowrap}
.utype-pick .sel{padding:5px 8px;font-size:.88rem}
.chooser{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 65%)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:700px){.choices{grid-template-columns:1fr}}
.choice{display:grid;gap:4px;align-content:start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.choice:hover{border-color:var(--accent);transform:translateY(-1px)}
.choice b{font-family:var(--display);font-size:1.2rem}
.choice span{font-size:.9rem;color:var(--muted);font-weight:500}
.utype-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.9rem}
.seg button{white-space:nowrap}

/* споделяне: „Копирай“ и „Изтегли PNG“ */
.share-row{display:flex;flex-wrap:wrap;gap:6px}
.kpi .share-row{margin-top:10px}
.sbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;line-height:1.4}
.sbtn:hover{color:var(--ink);border-color:var(--accent)}
.sbtn svg{flex:none}
.chart-share{margin:8px 0 2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;width:max-content;max-width:min(92vw,560px);background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:.9rem;font-weight:600}
.toast button{border:1px solid currentColor;background:none;color:inherit;border-radius:999px;padding:2px 10px;cursor:pointer;font-weight:600;font-size:.85rem}
@media (max-width:900px){.toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:16px}
.sheet-box{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px;width:100%;max-width:760px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow)}
.sheet-img{display:block;max-width:100%;height:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px}
.sheet-text{width:100%;min-height:170px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font:inherit;font-size:.9rem;resize:vertical}

/* топ 5 */
ol.rank{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ol.rank li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
ol.rank .rk{width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
ol.rank .line{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
ol.rank .line b{white-space:nowrap;font-variant-numeric:tabular-nums}
ol.rank .hbar{margin-top:5px}
.top-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px 28px}

/* мерки */
.mtabs{display:grid;justify-items:end;gap:4px}
.mtabs .psub{margin:0}
.mm{display:grid}
.mm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 16px;padding:11px 0;border-bottom:1px solid var(--line)}
.mm-row:last-child{border-bottom:0}
.mm-row .nm{font-weight:700}
.mm-row .wh{grid-column:1;color:var(--muted);font-size:.92rem;max-width:72ch}
.mm-row .yrs{grid-column:1;font-size:.82rem;color:var(--muted)}
.mm-row .ef{grid-row:1 / span 3;grid-column:2;text-align:right;font-weight:800;font-family:var(--display);font-size:1.15rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.mm-row .ef small{display:block;font-family:var(--body);font-size:.75rem;font-weight:600;color:var(--muted)}
.mm-row .ef.none{font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--muted);white-space:normal;max-width:15ch}
@media (max-width:560px){.mm-row{grid-template-columns:minmax(0,1fr)}.mm-row .ef{grid-row:auto;grid-column:1;text-align:left}.mm-row .ef small{display:inline;margin-left:6px}.mm-row .ef.none{max-width:none}}
.pg{display:none;font-size:.72rem;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap;vertical-align:1px}
body.show-src .pg{display:inline-block}
.sub-h{margin:20px 0 2px;font-size:1rem}

/* начало: заглавие и „Бюджет 2026 в шест числа“ — лента от плочки с тънки разделители, жълта черта отгоре */
.hero .lede{font-size:clamp(1.08rem,1.7vw,1.25rem);max-width:58ch}
.kstrip{position:relative;padding:0;overflow:hidden}
.kstrip::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--accent)}
.kstrip-head{padding:20px 20px 12px}
.kstrip-title{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.kstrip-title h2{font-family:var(--body);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.3}
.ktiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:0;background:var(--line);border-block:1px solid var(--line)}
.ktile{display:flex;flex-direction:column;gap:3px;min-width:0;padding:16px 20px 18px;background:var(--surface)}
.ktile dt{font-weight:700;font-size:.95rem;line-height:1.25}
.ktile dd{margin:0}
.ktile .kv{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.3vw,2.4rem);line-height:1.05;margin-top:2px}
.ktile .kv small{font-size:.95rem;font-weight:700;margin-left:2px}
.ktile .kc{font-size:.86rem;color:var(--muted);line-height:1.35}
.ktile .ks{margin-top:auto;padding-top:8px;font-size:.74rem;color:var(--muted);line-height:1.3}
.kstrip-foot{padding:12px 20px 16px}
@media (max-width:560px){.ktiles{grid-template-columns:repeat(2,minmax(0,1fr))}.ktile{padding:14px 14px 16px}.kstrip-head{padding:18px 14px 10px}.kstrip-foot{padding:10px 14px 14px}}

/* „Моите данъци“ на началната страница */
.mini-calc{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:16px 24px;align-items:start}
@media (max-width:640px){.mini-calc{grid-template-columns:1fr}}
@media (max-width:900px){.utype-pick .lbl{display:none}}
@media (max-width:480px){.topbar{gap:8px}.brand{font-size:1.08rem;gap:8px}.brand-mark{width:22px;height:22px}.utype-pick .sel{font-size:.82rem;padding:5px 4px}.src-toggle{padding:6px 9px}}

/* пътеводител (#/patevoditel): стъпки с номер, бележка, бутон към екрана и „Следва:“; накрая петте проверки */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.guide-cta{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 8px;width:fit-content;max-width:100%;margin-top:2px;padding:7px 14px;border:1px solid var(--accent);border-radius:999px;background:var(--accent-soft);text-decoration:none;font-weight:600;line-height:1.35}
.guide-cta:hover{background:var(--surface)}
.guide-cta:focus-visible{border-radius:999px}
.guide-cta svg{flex:none;color:var(--accent-ink)}
.guide-cta b{color:var(--accent-ink);font-weight:700}
.gsub{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,2.5vw,1.65rem);line-height:1.2}
.gsteps{list-style:none;margin:0;padding:0;display:grid;gap:18px;max-width:820px}
.gstep{position:relative;display:grid;gap:12px;scroll-margin-top:76px}
.gstep:not(:last-child)::after{content:"";position:absolute;left:37px;bottom:-19px;width:2px;height:18px;background:var(--accent)}
.gstep h2{display:flex;align-items:center;gap:12px;font-size:clamp(1.22rem,2.3vw,1.45rem)}
.gnum{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#15202B;font-family:var(--display);font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.gstep p,.gcheck p{max-width:70ch}
.gact{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.gbtn{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:10px 16px;border:1px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--surface);text-decoration:none;font-weight:700;line-height:1.25}
.gbtn:hover{background:var(--accent);border-color:var(--accent);color:#15202B}
.gbtn:focus-visible{border-radius:10px}
.gfoot{padding-top:12px;border-top:1px dashed var(--line)}
.gnext{font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.gnext:hover{text-decoration-color:var(--accent)}
.gnext .lbl{display:inline-block;color:var(--muted)}
.gstep:focus-visible,.gcheck:focus-visible{border-radius:12px}
.gcheck{position:relative;overflow:hidden;display:grid;gap:12px;max-width:820px;border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);scroll-margin-top:76px}
.gcheck::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--accent)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:grid;grid-template-columns:24px 6.2em minmax(0,1fr);gap:10px;align-items:center}
.checks .ck{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--accent);background:var(--surface);color:var(--accent-ink)}
.gpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;text-decoration:none}
.gpill:hover{border-color:var(--accent)}
.gpill:focus-visible{border-radius:999px}

/* v3.5 — пояснения в падащо поле: стоят под елемента, който обясняват, затворени са по подразбиране и са по-леки от бутоните */
details.info{max-width:72ch;font-size:.92rem;line-height:1.45}
details.info>summary{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:5px 0;cursor:pointer;list-style:none;font-weight:600;color:var(--muted);user-select:none;-webkit-tap-highlight-color:transparent}
details.info>summary::-webkit-details-marker{display:none}
details.info>summary span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
details.info>summary:hover{color:var(--ink)}
details.info>summary:hover span{text-decoration-color:var(--accent)}
details.info>summary>svg:first-child{flex:none;color:var(--data)}
details.info>summary .chev{flex:none;transition:transform .2s}
details.info[open]>summary{color:var(--ink)}
details.info[open]>summary .chev{transform:rotate(180deg)}
details.info .info-body{display:grid;gap:6px;margin:4px 0 2px 7px;padding:2px 0 2px 16px;border-left:2px solid var(--data);color:var(--ink)}
details.info .info-body p{max-width:70ch}
@media (pointer:coarse){details.info>summary{padding:10px 0}}

/* v3.5 — „Следва“ в края на всеки екран: заоблен бутон с заглавие, ред описание и стрелка вдясно */
.next{display:grid;gap:10px;padding-top:4px;min-width:0}
.next-h{font-family:var(--body);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.3}
.next-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;max-width:820px;min-width:0}
.nextbtn{display:flex;align-items:center;gap:16px;min-height:92px;padding:18px 18px 18px 22px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 72%);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.nextbtn .nx{display:grid;gap:3px;min-width:0;flex:1}
.nextbtn .nx-k{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nextbtn .nx-t{font-family:var(--display);font-size:1.32rem;font-weight:800;line-height:1.15}
.nextbtn .nx-d{font-size:.93rem;color:var(--muted);line-height:1.35}
.nextbtn .nx-go{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--surface);transition:transform .2s,background .2s,color .2s}
.nextbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.nextbtn:hover .nx-go{background:var(--accent);color:#15202B;transform:translateX(3px)}
.nextbtn:active{transform:none}
.nextbtn:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:18px}
.nextbtn.alt{background:var(--surface);box-shadow:none}
.nextbtn.alt .nx-go{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* v3.5 — търсене на началната страница: в заглавната част, на реда на пътеводителя, точно над шестте числа */
.hero .lede a{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.hero .lede a:hover{color:var(--accent-ink)}
.hero-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.qs{position:relative;flex:1 1 340px;min-width:0;max-width:640px}
.qs-box{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);cursor:text;transition:border-color .15s,box-shadow .15s}
.qs-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qs-box svg{flex:none;color:var(--muted)}
.qs-box input{flex:1;min-width:0;height:100%;border:0;padding:0;background:none;outline:none;font-size:1rem;font-weight:500}
.qs-box input::placeholder{color:var(--muted);opacity:1}
.qs-kbd{flex:none;font:600 .75rem/1 var(--body);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--sunk)}
@media (hover:none){.qs-kbd{display:none}}
.qs-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;max-height:min(70vh,560px);overflow:auto;overscroll-behavior:contain;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(10,16,24,.22)}
.qs-stat{padding:6px 10px;font-size:.82rem;font-weight:600;color:var(--muted)}
.qs-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.qs-hit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}
.qs-hit:hover{background:var(--sunk)}
.qs-hit:focus-visible{background:var(--sunk);outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.qs-n{font-weight:700;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.qs-k{display:inline-block;margin-right:2px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);vertical-align:2px;white-space:nowrap}
.qs-v{font-family:var(--display);font-size:1.08rem;font-weight:800;line-height:1.3;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.qs-p{font-size:.84rem;line-height:1.35;color:var(--muted);min-width:0}
.qs-go{font-size:.8rem;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap;align-self:end}
.qs-hit mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.qs-src{display:none;grid-column:1 / -1;font-size:.76rem;color:var(--muted)}
body.show-src .qs-src{display:block}
.qs-more{display:block;margin:6px auto 4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.86rem;font-weight:600;cursor:pointer}
.qs-more:hover{border-color:var(--accent)}
.qs-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 10px 10px}
.qs-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.86rem;font-weight:600;cursor:pointer}
.qs-chip:hover{border-color:var(--accent)}
@media (max-width:900px){.qs-res{max-height:min(60vh,480px)}}
@media (max-width:560px){.qs{flex-basis:100%}.qs-hit{grid-template-columns:minmax(0,1fr)}.qs-v,.qs-go{text-align:left}}
/* плочките в лентата водят към своя екран */
.kt-a{color:inherit;text-decoration:none}
.kt-a .kt-go{color:var(--muted);transition:transform .15s,color .15s;display:inline-block}
.kt-a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.kt-a:hover .kt-go{color:var(--accent-ink);transform:translateX(2px)}

/* v3.5 — преход към конкретен ред (от търсенето): целта е под горната лента и за миг е подчертана */
main [id]{scroll-margin-top:76px}
@media (max-width:900px){html{scroll-padding-bottom:72px}main [id]{scroll-margin-bottom:72px}}
.hl{animation:hl 2.6s ease-out}
tr.hl>td{animation:hlbg 2.6s ease-out}
@keyframes hl{0%,35%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
@keyframes hlbg{0%,35%{background:var(--accent-soft)}100%{background:transparent}}

/* v3.6 — речник (#/rechnik), по PDF-а „Речник: бюджетът на разбираем език“: петте раздела с номерираните термини (заглавие,
   определение, „Пример:“ в по-бледо), търсачка „Коя дума не разбираш?“, категории, азбучен указател, „Свързани понятия“, източници */
.gl-tools{display:grid;gap:12px}
.gl-lbl{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.2;width:fit-content}
.gl-tools .qs-box{max-width:640px}
.gl-row{display:grid;grid-template-columns:10.5em minmax(0,1fr);gap:6px 12px;align-items:start}
.gl-k{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:8px}
@media (max-width:640px){.gl-row{grid-template-columns:minmax(0,1fr)}.gl-k{padding-top:0}}
.gl-chips,.gl-az{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.gl-chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:600;line-height:1.3;cursor:pointer}
.gl-chip span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.gl-l{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;cursor:pointer}
.gl-chip:hover,.gl-l:hover{border-color:var(--accent)}
.gl-chip[aria-pressed="true"],.gl-l[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.gl-chip[aria-pressed="true"] span{color:inherit;opacity:.8}
.gl-statrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin-bottom:-14px}
.gl-stat{font-size:.9rem;font-weight:600;color:var(--muted)}
.gl-list{display:grid;gap:20px;min-width:0}
.gl-sec h2{font-size:clamp(1.3rem,2.4vw,1.55rem)}
.gl-range{margin-top:4px;font-size:.85rem;color:var(--muted)}
.gl-terms{margin-top:6px}
.gl-term{position:relative;margin:0 -12px;padding:14px 12px;border-radius:8px}
.gl-term+.gl-term::before{content:"";position:absolute;top:0;left:12px;right:12px;border-top:1px solid var(--line)}
.gl-t{font-family:var(--display);font-size:1.2rem;font-weight:800;line-height:1.2}
.gl-n{color:var(--muted);font-variant-numeric:tabular-nums}
.gl-t mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.gl-cat{display:inline-block;margin-top:6px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.gl-d{margin-top:6px;max-width:70ch}
details.gl-more{margin-top:4px;max-width:72ch}
details.gl-more>summary{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 0;cursor:pointer;list-style:none;font-size:.9rem;font-weight:600;color:var(--muted);user-select:none;-webkit-tap-highlight-color:transparent}
details.gl-more>summary::-webkit-details-marker{display:none}
details.gl-more>summary span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
details.gl-more>summary:hover,details.gl-more[open]>summary{color:var(--ink)}
details.gl-more>summary:hover span{text-decoration-color:var(--accent)}
details.gl-more>summary .chev{flex:none;transition:transform .2s}
details.gl-more[open]>summary .chev{transform:rotate(180deg)}
@media (pointer:coarse){details.gl-more>summary{padding:10px 0}}
.gl-body{display:grid;gap:8px;margin:4px 0 2px 6px;padding:2px 0 2px 14px;border-left:2px solid var(--accent)}
.gl-ex{font-size:.95rem;color:var(--muted)}
.gl-rel{font-size:.92rem}
.gl-rel a,.gl-rels a,.gl-srcs a{font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.gl-rel a:hover,.gl-rels a:hover,.gl-srcs a:hover{text-decoration-color:var(--accent)}
.gl-note{color:var(--muted)}
.gl-see a{font-size:.92rem;font-weight:700;text-decoration:none}
.gl-see a span{color:var(--muted);font-weight:600}
.gl-see a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.gl-term.hl{animation:hl 2.6s ease-out,hlbg 2.6s ease-out}
.gl-rels,.gl-srcs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.gl-rel-h{font-weight:700}
.gl-rel-note{margin-top:2px;font-size:.92rem;color:var(--muted)}
.gl-srcs{gap:9px}
.gl-srcs a{overflow-wrap:anywhere}
.gl-host{display:block;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.gl-sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* думите от речника в текста на другите екрани: точкувано подчертаване; клик — кратко пояснение на място (glPop) */

// slug (адресът #/rechnik/<slug>), name/abbr (от „Име - СЪКР“) и alias — търсещите синоними, всички от самия PDF.
const GLOSSARY = {"title":"Речник: бюджетът на разбираем език","sub":"64 основни термина с обяснения и практически примери","date":"2026-10-01","intro":{"lead":"За първи път срещаш тези понятия?","text":"Попадна на непозната дума? Намери я тук. Обясняваме финансовите понятия с кратки определения и примери от ежедневието, без да очакваме да си икономист.","disclaimer":{"bold":"Числата в примерите са условни.","text":"Те служат за обяснение и не представят действителния бюджет или непременно действащите данъчни ставки."}},"cats":[{"id":"osnovi","title":"Основи: как е устроен бюджетът","short":"Основи","from":1,"to":13},{"id":"danatsi-i-prihodi","title":"Приходи, данъци и заплати","short":"Данъци и приходи","from":14,"to":29},{"id":"razhodi-i-merki","title":"Разходи, институции и бюджетни мерки","short":"Разходи и мерки","from":30,"to":42},{"id":"defitsit-i-dalg","title":"Дефицит, дълг и финансиране","short":"Дефицит и дълг","from":43,"to":52},{"id":"kak-da-chetem-chislata","title":"Как да четем числата правилно","short":"Как да четем числата","from":53,"to":64}],"terms":[{"n":1,"slug":"byudzhet","title":"Бюджет","name":"Бюджет","abbr":null,"cat":"osnovi","def":"План за това колко пари се очаква да постъпят и за какво ще бъдат използвани през определен период.","ex":"Училище планира средства за заплати, отопление, учебни материали и ремонт. Всичко това влиза в неговия бюджет.","alias":[]},{"n":2,"slug":"darzhaven-byudzhet","title":"Държавен бюджет","name":"Държавен бюджет","abbr":null,"cat":"osnovi","def":"Бюджетът на централните държавни институции и централния бюджет. Той не обхваща самостоятелно всички публични финанси: общините и осигурителните фондове имат отделни бюджети.","ex":"Парите за работата на едно министерство са част от държавния бюджет. Общинският бюджет на твоя град е отделен.","alias":[]},{"n":3,"slug":"obshtinski-byudzhet","title":"Общински бюджет","name":"Общински бюджет","abbr":null,"cat":"osnovi","def":"Планът за приходите и разходите на конкретна община. Средствата идват от местни приходи, трансфери и други източници.","ex":"Общината предвижда пари за улично осветление, детски градини и поддръжка на паркове.","alias":[]},{"n":4,"slug":"kfp","title":"Консолидирана фискална програма - КФП","name":"Консолидирана фискална програма","abbr":"КФП","cat":"osnovi","def":"Общ поглед към бюджетите и сметките, включени в нея: държавния бюджет, общинските бюджети, осигурителните фондове и други. Вътрешните преводи се премахват при обединяването, за да няма двойно броене.","ex":"За да видиш по-широката картина на публичните разходи, разглеждаш КФП, а не само разходите на министерствата.","alias":["КФП"]},{"n":5,"slug":"konsolidirane","title":"Консолидиране","name":"Консолидиране","abbr":null,"cat":"osnovi","def":"Обединяване на няколко сметки, като се премахват движенията на пари между тях.","ex":"Държавата превежда 1 млн. евро на община, която плаща с тях ремонт. В общия разход не броим и превода, и ремонта като два отделни милиона.","alias":[]},{"n":6,"slug":"sektor-darzhavno-upravlenie","title":"Сектор „Държавно управление“","name":"Сектор „Държавно управление“","abbr":null,"cat":"osnovi","def":"Статистическа група от институции и организации, определена по общи правила, за измерване на публичните финанси. Не означава само правителството и не включва автоматично всяко държавно предприятие.","ex":"При европейско сравнение на дефицита се разглеждат и местното управление и социалноосигурителните фондове.","alias":[]},{"n":7,"slug":"byudzhetna-godina","title":"Бюджетна година","name":"Бюджетна година","abbr":null,"cat":"osnovi","def":"Периодът, за който е приет годишният бюджет. В България той съвпада с календарната година.","ex":"Бюджетът за 2026 г. се отнася за периода от 1 януари до 31 декември 2026 г.","alias":[]},{"n":8,"slug":"proektobyudzhet","title":"Проектобюджет","name":"Проектобюджет","abbr":null,"cat":"osnovi","def":"Предложение за бюджет, което още не е окончателно прието. Сумите и мерките могат да се променят при обсъждането.","ex":"Предложени са 20 млн. евро за спорт, но при приемането сумата става 23 млн.","alias":[]},{"n":9,"slug":"priet-byudzhet","title":"Приет бюджет","name":"Приет бюджет","abbr":null,"cat":"osnovi","def":"Официално одобреният план за приходите и разходите. Приетите средства не означават, че вече са изразходвани.","ex":"За нова детска градина са одобрени 3 млн. евро. Строителството и плащанията тепърва предстоят.","alias":[]},{"n":10,"slug":"aktualizatsiya-na-byudzheta","title":"Актуализация на бюджета","name":"Актуализация на бюджета","abbr":null,"cat":"osnovi","def":"Официална промяна на вече приетия бюджет. Не всяко преместване на средства между пера е актуализация на бюджетния закон.","ex":"След голямо бедствие се приемат промени, които увеличават средствата за възстановяване.","alias":[]},{"n":11,"slug":"byudzhetna-prognoza","title":"Бюджетна прогноза","name":"Бюджетна прогноза","abbr":null,"cat":"osnovi","def":"Оценка как могат да се развият приходите, разходите и други показатели в бъдеще. Това е очакване, а не гаранция.","ex":"Очаква се през следващата година да постъпят повече данъци заради по-високи доходи и потребление.","alias":[]},{"n":12,"slug":"izpalnenie-na-byudzheta","title":"Изпълнение на бюджета","name":"Изпълнение на бюджета","abbr":null,"cat":"osnovi","def":"Какво действително е събрано и изразходвано спрямо плана.","ex":"Предвидени са 10 млн. евро за ремонти, а към юни са платени 4 млн. Изпълнението на тези разходи е 40%.","alias":["Изпълнение"]},{"n":13,"slug":"otchet-za-byudzheta","title":"Отчет за бюджета","name":"Отчет за бюджета","abbr":null,"cat":"osnovi","def":"Документ или набор от данни, който показва как е изпълнен бюджетът за изминал период.","ex":"След края на годината общината публикува колко е получила и за какво е похарчила средствата.","alias":["отчет"]},{"n":14,"slug":"byudzhetni-prihodi","title":"Бюджетни приходи","name":"Бюджетни приходи","abbr":null,"cat":"danatsi-i-prihodi","def":"Средства, които постъпват в бюджета от данъци, осигуровки, такси и други източници. Полученият заем се отчита като финансиране, а не като обикновен бюджетен приход.","ex":"Постъпленията от данъка върху доходите са приход. Парите от нов държавен заем са финансиране.","alias":[]},{"n":15,"slug":"danachni-prihodi","title":"Данъчни приходи","name":"Данъчни приходи","abbr":null,"cat":"danatsi-i-prihodi","def":"Частта от бюджетните приходи, която идва от данъци.","ex":"Когато се събира ДДС от продажби, постъпленията са данъчни приходи.","alias":[]},{"n":16,"slug":"nedanachni-prihodi","title":"Неданъчни приходи","name":"Неданъчни приходи","abbr":null,"cat":"danatsi-i-prihodi","def":"Приходи от източници, различни от данъците: например такси, глоби, наеми и доходи от собственост.","ex":"Община отдава свое помещение под наем. Полученият наем е неданъчен приход.","alias":[]},{"n":17,"slug":"bezvazmezdno-finansirane","title":"Безвъзмездно финансиране","name":"Безвъзмездно финансиране","abbr":null,"cat":"danatsi-i-prihodi","def":"Средства, предоставени за определена цел, без обичайно задължение за връщане, ако условията са спазени.","ex":"Училище получава европейско финансиране за лаборатория. При нарушения може да се наложи връщане на част от сумата.","alias":[]},{"n":18,"slug":"danak","title":"Данък","name":"Данък","abbr":null,"cat":"danatsi-i-prihodi","def":"Задължително плащане, което финансира публичните дейности, без срещу него да получаваш точно определена индивидуална услуга.","ex":"Плащането на данък върху дохода не купува конкретен брой посещения при лекар или часове обучение.","alias":[]},{"n":19,"slug":"danachna-osnova","title":"Данъчна основа","name":"Данъчна основа","abbr":null,"cat":"danatsi-i-prihodi","def":"Сумата, върху която се изчислява данъкът. Тя невинаги е равна на целия получен доход или крайната цена.","ex":"Ако данъчната основа е 900 евро, а ставката е 10%, данъкът е 90 евро.","alias":[]},{"n":20,"slug":"danachna-stavka","title":"Данъчна ставка","name":"Данъчна ставка","abbr":null,"cat":"danatsi-i-prihodi","def":"Процентът или фиксираният размер, чрез който се определя данъкът.","ex":"При ставка 10% върху основа от 500 евро дължимият данък е 50 евро.","alias":[]},{"n":21,"slug":"dds","title":"Данък върху добавената стойност - ДДС","name":"Данък върху добавената стойност","abbr":"ДДС","cat":"danatsi-i-prihodi","def":"Данък върху потреблението, който обикновено е включен в цената на облагаемите покупки. Фирмите го начисляват и отчитат по установените правила.","ex":"При цена без данък 100 евро и ставка 20% крайната цена е 120 евро. ДДС е 20 евро, а не 20% от крайните 120 евро.","alias":["ДДС"]},{"n":22,"slug":"aktsiz","title":"Акциз","name":"Акциз","abbr":null,"cat":"danatsi-i-prihodi","def":"Специален данък върху определени стоки, например тютюневи изделия, алкохол и горива.","ex":"Част от цената на литър гориво е акциз. Върху съответната данъчна основа се начислява и ДДС.","alias":[]},{"n":23,"slug":"danak-varhu-dohodite","title":"Данък върху доходите","name":"Данък върху доходите","abbr":null,"cat":"danatsi-i-prihodi","def":"Данък върху облагаемите доходи на човек, изчислен според приложимите правила.","ex":"При получаване на заплата работодателят обикновено удържа данък и го превежда към бюджета.","alias":[]},{"n":24,"slug":"korporativen-danak","title":"Корпоративен данък","name":"Корпоративен данък","abbr":null,"cat":"danatsi-i-prihodi","def":"Данък върху данъчната печалба на фирмата. Тя може да се различава от счетоводната печалба след предвидените корекции.","ex":"Магазин има големи продажби, но и големи разходи. Корпоративният данък не се изчислява просто върху всички пари, минали през касата.","alias":[]},{"n":25,"slug":"osiguritelni-vnoski","title":"Осигурителни вноски","name":"Осигурителни вноски","abbr":null,"cat":"danatsi-i-prihodi","def":"Плащания за системи, които осигуряват защита при определени рискове и потребности: например пенсиониране, заболяване и безработица.","ex":"При работа на трудов договор се правят вноски, свързани с пенсионното и здравното осигуряване.","alias":["осигуровки"]},{"n":26,"slug":"osiguritelen-dohod","title":"Осигурителен доход","name":"Осигурителен доход","abbr":null,"cat":"danatsi-i-prihodi","def":"Сумата, върху която се изчисляват осигуровките. За нея могат да важат минимални и максимални граници.","ex":"Ако приложимият осигурителен доход е 1 000 евро, вноска от 5% означава 50 евро.","alias":[]},{"n":27,"slug":"brutna-zaplata","title":"Брутна заплата","name":"Брутна заплата","abbr":null,"cat":"danatsi-i-prihodi","def":"Възнаграждението преди удържането на личните осигуровки и данъка.","ex":"Договорена брутна заплата от 1 500 евро не означава, че 1 500 евро ще постъпят по банковата ти сметка.","alias":["заплата преди удръжки"]},{"n":28,"slug":"netna-zaplata","title":"Нетна заплата","name":"Нетна заплата","abbr":null,"cat":"danatsi-i-prihodi","def":"Сумата след удържането на личните осигуровки и данъка, често наричана „чиста заплата“.","ex":"При условна брутна заплата 1 500 евро и общо удръжки 330 евро нетната заплата е 1 170 евро.","alias":["чиста заплата"]},{"n":29,"slug":"obsht-razhod-na-rabotodatelya-za-zaplata","title":"Общ разход на работодателя за заплата","name":"Общ разход на работодателя за заплата","abbr":null,"cat":"danatsi-i-prihodi","def":"Брутната заплата плюс осигурителните вноски за сметка на работодателя. По-широките разходи за труд могат да включват и други елементи.","ex":"При брутна заплата 1 500 евро и работодателски вноски 280 евро общият разход за тях е 1 780 евро.","alias":["разход на работодателя"]},{"n":30,"slug":"byudzhetni-razhodi","title":"Бюджетни разходи","name":"Бюджетни разходи","abbr":null,"cat":"razhodi-i-merki","def":"Средствата за публични дейности, услуги, плащания и инвестиции. Не всяко излизане на пари е бюджетен разход: връщането на главницата на заем се отчита отделно като финансиране.","ex":"Заплатата на учител е бюджетен разход. Погасяването на самия държавен заем има друго отчетно място.","alias":[]},{"n":31,"slug":"tekushti-razhodi","title":"Текущи разходи","name":"Текущи разходи","abbr":null,"cat":"razhodi-i-merki","def":"Разходи за ежедневното функциониране на услуги и институции, както и за текущи плащания.","ex":"Токът, отоплението, заплатите и почистващите материали в училище са текущи разходи.","alias":[]},{"n":32,"slug":"kapitalovi-razhodi","title":"Капиталови разходи","name":"Капиталови разходи","abbr":null,"cat":"razhodi-i-merki","def":"Разходи за придобиване, изграждане или значително подобряване на дълготрайни активи.","ex":"Изграждането на нова училищна сграда е капиталов разход. Купуването на препарати за нея е текущ разход.","alias":[]},{"n":33,"slug":"byudzheten-transfer","title":"Бюджетен трансфер","name":"Бюджетен трансфер","abbr":null,"cat":"razhodi-i-merki","def":"Прехвърляне на средства от един бюджет към друг.","ex":"Държавният бюджет превежда средства на община за финансиране на определени дейности.","alias":[]},{"n":34,"slug":"subsidiya","title":"Субсидия","name":"Субсидия","abbr":null,"cat":"razhodi-i-merki","def":"Финансова подкрепа за организация или дейност, предоставена при определени условия.","ex":"Общината подпомага автобусна линия, за да има транспорт и до населено място с малко пътници.","alias":[]},{"n":35,"slug":"obshtestvena-porachka","title":"Обществена поръчка","name":"Обществена поръчка","abbr":null,"cat":"razhodi-i-merki","def":"Процедура, чрез която публична институция избира доставчик на стоки, услуги или строителство по определени правила.","ex":"Община организира обществена поръчка за ремонт на улица, а фирмите подават оферти.","alias":[]},{"n":36,"slug":"byudzhetna-funktsiya","title":"Бюджетна функция","name":"Бюджетна функция","abbr":null,"cat":"razhodi-i-merki","def":"Група разходи според обществената цел, за която се използват: например образование или здравеопазване.","ex":"Разходи на различни институции могат да бъдат обединени във функция „Образование“, когато служат на тази цел.","alias":[]},{"n":37,"slug":"byudzhetna-programa","title":"Бюджетна програма","name":"Бюджетна програма","abbr":null,"cat":"razhodi-i-merki","def":"Група дейности и средства, насочени към определени цели и резултати.","ex":"Програма за пътна безопасност може да включва обучение, контрол и подобряване на опасни участъци.","alias":[]},{"n":38,"slug":"parvostepenen-razporeditel-s-byudzhet","title":"Първостепенен разпоредител с бюджет","name":"Първостепенен разпоредител с бюджет","abbr":null,"cat":"razhodi-i-merki","def":"Органът, който управлява бюджет на най-високото му ниво и носи отговорност за него, включително за подчинени бюджетни структури.","ex":"Министър управлява бюджета на министерството и разпределението към структурите в неговата система.","alias":[]},{"n":39,"slug":"prihodna-myarka","title":"Приходна мярка","name":"Приходна мярка","abbr":null,"cat":"razhodi-i-merki","def":"Решение, което променя размера или събирането на бюджетните приходи. Може да ги увеличи или намали.","ex":"Данъчно облекчение може да намали приходите, а по-добър контрол върху неплатени задължения да ги увеличи.","alias":[]},{"n":40,"slug":"razhodna-myarka","title":"Разходна мярка","name":"Разходна мярка","abbr":null,"cat":"razhodi-i-merki","def":"Решение, което променя размера, предназначението или начина на извършване на разходите.","ex":"Увеличаването на средствата за домашна грижа е разходна мярка. Намаляването на определена субсидия също е такава.","alias":[]},{"n":41,"slug":"fiskalen-efekt","title":"Фискален ефект","name":"Фискален ефект","abbr":null,"cat":"razhodi-i-merki","def":"Очакваната или измерена промяна в бюджетните приходи, разходи или салдо вследствие на дадено решение.","ex":"Нова програма струва допълнително 10 млн. евро годишно. Това е ефектът върху разходите, а не автоматично оценка на обществената ѝ полза.","alias":[]},{"n":42,"slug":"bazov-stsenariy","title":"Базов сценарий","name":"Базов сценарий","abbr":null,"cat":"razhodi-i-merki","def":"Отправната точка, спрямо която се оценява една промяна: какво се g-novo-zaemane","title":"Нов дълг / ново заемане","name":"Нов дълг / ново заемане","abbr":null,"cat":"defitsit-i-dalg","def":"Парите, които държавата заема през даден период. Част могат да се използват за връщане на стар дълг.","ex":"Взети са 10 млн. евро, от които 7 млн. погасяват стар заем. Новото заемане е 10 млн., но само от тези операции дългът нараства с 3 млн.","alias":["Нов дълг","ново заемане"]},{"n":49,"slug":"glavnitsa","title":"Главница","name":"Главница","abbr":null,"cat":"defitsit-i-dalg","def":"Самата заета сума, която трябва да бъде върната, отделно от лихвите и таксите.","ex":"При заем от 1 000 евро главницата е 1 000 евро. Допълнително дължимите 50 евро лихва не са част от първоначалната главница.","alias":[]},{"n":50,"slug":"lihva","title":"Лихва","name":"Лихва","abbr":null,"cat":"defitsit-i-dalg","def":"Цената за използването на заети пари. За този, който предоставя парите, тя е доход.","ex":"При заем от 1 000 евро за една година с проста годишна лихва 5%, без такси и междинни плащания, лихвата е 50 евро.","alias":[]},{"n":51,"slug":"refinansirane","title":"Рефинансиране","name":"Рефинансиране","abbr":null,"cat":"defitsit-i-dalg","def":"Замяна или погасяване на стар заем чрез ново финансиране.","ex":"Държавен заем трябва да се върне през декември. Държавата взема нов заем и използва средствата за погасяването му. Задължението не изчезва: променят се условията и срокът.","alias":[]},{"n":52,"slug":"fiskalen-rezerv","title":"Фискален резерв","name":"Фискален резерв","abbr":null,"cat":"defitsit-i-dalg","def":"Финансов буфер на държавата. Официалният показател включва определени наличности и други компоненти, като част от средствата могат да имат конкретно предназначение.","ex":"Голям данъчен приход се очаква по-късно през месеца, но плащане трябва да се направи сега. Наличните средства помагат да се преодолее разминаването във времето.","alias":[]},{"n":53,"slug":"bvp","title":"Брутен вътрешен продукт - БВП","name":"Брутен вътрешен продукт","abbr":"БВП","cat":"kak-da-chetem-chislata","def":"Мярка за стойността, създадена от производството на стоки и услуги в страната за определен период. Не е сумата в държавната каса.","ex":"Хлябът, произведен в пекарна, и услугата на фризьора участват в икономическата дейност, измервана чрез БВП.","alias":["БВП"]},{"n":54,"slug":"dyal-ot-bvp","title":"Дял от БВП","name":"Дял от БВП","abbr":null,"cat":"kak-da-chetem-chislata","def":"Сравнение на дадена сума с размера на икономиката. Помага да сравняваме държави с различна големина.","ex":"Дълг от 30 млрд. евро при годишен БВП 100 млрд. евро е 30% от БВП. Това не означава, че 30% от бюджета се харчи за дълг.","alias":[]},{"n":55,"slug":"inflatsiya","title":"Инфлация","name":"Инфлация","abbr":null,"cat":"kak-da-chetem-chislata","def":"Общо повишаване на цените на стоките и услугите, измерено чрез представителна кошница. Поскъпването на един продукт не е достатъчно, за да опише инфлацията.","ex":"Ако една и съща кошница е струвала 100 евро, а сега струва 105 евро, поскъпването ѝ е 5%. Личните ти покупки може да са поскъпнали различно.","alias":[]},{"n":56,"slug":"nominalen-rast","title":"Номинален ръст","name":"Номинален ръст","abbr":null,"cat":"kak-da-chetem-chislata","def":"Увеличение на сумата в пари, без да се отчита промяната на цените.","ex":"Бюджетът на библиотека се увеличава от 100 000 на 110 000 евро. Номиналният ръст е 10%.","alias":[]},{"n":57,"slug":"realen-rast","title":"Реален ръст","name":"Реален ръст","abbr":null,"cat":"kak-da-chetem-chislata","def":"Промяната след отчитане на цените: дали средствата позволяват да се купи повече.","ex":"Бюджетът нараства с 10%, но цените на купуваните стоки и услуги също нарастват с 10%. Покупателната възможност остава приблизително същата.","alias":[]},{"n":58,"slug":"protsenten-punkt","title":"Процентен пункт","name":"Процентен пункт","abbr":null,"cat":"kak-da-chetem-chislata","def":"Единица за разликата между два процента. Не е същото като процентно увеличение.","ex":"Дял се увеличава от 20% на 25%. Това е ръст с 5 процентни пункта, но с 25% спрямо първоначалния дял.","alias":[]},{"n":59,"slug":"razhod-na-chovek","title":"Разход на човек","name":"Разход на човек","abbr":null,"cat":"kak-da-chetem-chislata","def":"Общият разход, разделен на броя хора в посочената група. Показва средна стойност, а не лично получена сума.","ex":"Ако община с 10 000 жители харчи 1 млн. евро за паркове, това са 100 евро на жител. Никой не получава тези 100 евро в брой.","alias":[]},{"n":60,"slug":"sezonnost","title":"Сезонност","name":"Сезонност","abbr":null,"cat":"kak-da-chetem-chislata","def":"Повтарящи се разлики през годината, които влияят кога постъпват приходите и кога се извършват разходите.","ex":"Някои ремонти се правят основно през топлите месеци. Затова ниските разходи през февруари не означават непременно изоставане.","alias":[]},{"n":61,"slug":"kasova-osnova","title":"Касова основа","name":"Касова основа","abbr":null,"cat":"kak-da-chetem-chislata","def":"Отчитане според момента, в който парите действително са получени или платени.","ex":"Ремонтът приключва през декември, но фактурата е платена през януари. На касова основа плащането е през януари.","alias":[]},{"n":62,"slug":"nachislena-osnova","title":"Начислена основа","name":"Начислена основа","abbr":null,"cat":"kak-da-chetem-chislata","def":"Отчитане според момента, в който възниква икономическата операция, а не непременно когато се плаща.","ex":"При същия ремонт задължението може да се отчете през декември, когато работата е извършена и приета, въпреки плащането през януари.","alias":[]},{"n":63,"slug":"nominalna-suma-i-dyal-ot-obshtoto","title":"Номинална сума и дял от общото","name":"Номинална сума и дял от общото","abbr":null,"cat":"kak-da-chetem-chislata","def":"Сумата показва колко пари са отделени. Делът показва каква част са те от по-голямата сума. Двете могат да се движат в различни посоки.","ex":"Средствата за спорт растат от 10 на 12 млн. евро, но общият бюджет расте от 100 на 150 млн. Средствата са повече, а делът им намалява от 10% на 8%.","alias":[]},{"n":64,"slug":"darzhavna-garantsiya","title":"Държавна гаранция","name":"Държавна гаранция","abbr":null,"cat":"kak-da-chetem-chislata","def":"Обещание на държавата да поеме плащане при определени условия, ако кредитополучателят не изпълни задължението си. Това създава риск за бюджета, но не е автоматично текущ разход.","ex":"Публично предприятие взема гарантиран заем. Ако спре да го обслужва и гаранцията бъде задействана, държавата може да трябва да плати.","alias":[]}],"rel":[{"text":"Дефицит → Салдо, дълг, ново заемане","from":"Дефицит","to":["Салдо","дълг","ново заемане"],"note":"Дефицитът е за период; дългът е към дата.","terms":[44,43,47,48]},{"text":"Държавен бюджет → КФП, общински бюджет, сектор „Държавно управление“","from":"Държавен бюджет","to":["КФП","общински бюджет","сектор „Държавно управление“"],"note":"Различните обхвати не са взаимозаменяеми.","terms":[2,4,3,6]},{"text":"Брутна заплата → Нетна заплата, осигуровки, разход на работодателя","from":"Брутна заплата","to":["Нетна заплата","осигуровки","разход на работодателя"],"note":"Личните удръжки и работодателските вноски са различни.","terms":[27,28,25,29]},{"text":"Разходна мярка → Фискален ефект, базов сценарий","from":"Разходна мярка","to":["Фискален ефект","базов сценарий"],"note":"„Спестяване“ невинаги означава по-малко спрямо миналата година.","terms":[40,41,42]},{"text":"Изпълнение → Приет бюджет, отчет, сезонност","from":"Изпълнение","to":["Приет бюджет","отчет","сезонност"],"note":"Изминали 50% от годината не означава задължително 50% изпълнение.","terms":[12,9,13,60]},{"text":"Номинален ръст → Реален ръст, инфлация","from":"Номинален ръст","to":["Реален ръст","инфлация"],"note":"Повече евро невинаги купуват повече услуги.","terms":[56,57,55]},{"text":"Касова основа → Начислена основа","from":"Касова основа","to":["Начислена основа"],"note":"Различният момент на отчитане може да даде различни стойности.","terms":[61,62]}],"src":{"intro":"Обясненията са образователни формулировки на разбираем език. За подробните определения, методологията и актуалните правила използвайте първичните източници по-долу. Числовите примери са условни.","items":[{"name":"Министерство на финансите: Консолидирана фискална програма","url":"https://www.minfin.bg/bg/383"},{"name":"Eurostat: методология на публичните финанси","url":"https://ec.europa.eu/eurostat/web/government-finance-statistics/methodology"},{"name":"Eurostat: Government deficit and debt","url":"https://ec.europa.eu/eurostat/cache/metadata/EN/gov_10dd_esms.htm"},{"name":"НАП: ДДС в България","url":"https://nra.bg/wps/portal/nra/taxes/dds-v-balgariya"},{"name":"ЕЦБ: образователни обяснения","url":"https://www.ecb.europa.eu/ecb-and-you/explainers/html/index.en.html"},{"name":"ЕЦБ: Какво е инфлация?","url":"https://www.ecb.europa.eu/ecb-and-you/explainers/tell-me-more/html/what_is_inflation.en.html"},{"name":"ЕЦБ: Какво са лихвените проценти?","url":"https://data.ecb.europa.eu/methodology/what-are-interest-rates"}]}};

const fmt = (n, d = 1) => n.toLocaleString("bg-BG", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt0 = n => Math.round(n).toLocaleString("bg-BG");
const bn = (thousands) => thousands / 1e6; // хил. € → млрд. €
const mln = (thousands) => thousands / 1e3;
function money(thousands) {
  const b = bn(thousands);
  return b >= 1 ? `${fmt(b, 2)} млрд. €` : `${fmt(mln(thousands), 1)} млн. €`;
}
const MONTHS = ["яну", "фев", "мар", "апр", "май", "юни", "юли", "авг", "сеп", "окт", "ное", "дек"];
const MONTHS_FULL = ["януари", "февруари", "март", "април", "май", "юни", "юли", "август", "септември", "октомври", "ноември", "декември"];
const sgn = (x, d = 1) => (x < 0 ? "−" : x > 0 ? "+" : "") + fmt(Math.abs(x), d); // със знак и типографски минус
const mlnFmt = m => m >= 1000 ? `${fmt(m / 1000, 2)} млрд. €` : `${fmt(m, 1)} млн. €`; // вход в млн. €
const signPct = x => Math.abs(x) < 0.05 ? "0,0%" : `${x > 0 ? "+" : "−"}${fmt(Math.abs(x))}%`;
function ppFmt(bnEur) { // € на човек, с точност според размера
  const x = bnEur * 1e9 / (POP * 1e6);
  return x >= 100 ? fmt0(Math.round(x / 10) * 10) : x >= 10 ? fmt0(x) : fmt(x, 1);
}
// COFOG: сума по кодове; код с „-“ отпред се изважда.
function cofogSeries(codes, unit) {
  return COFOG.years.map((y, i) => codes.reduce((a, c) => c[0] === "-" ? a - COFOG[unit][c.slice(1)][i] : a + COFOG[unit][c][i], 0));
}
const cofogCodes = codes => codes.map((c, i) => c[0] === "-" ? "− " + c.slice(1) : (i ? "+ " : "") + c).join(" ");
const cofogText = codes => codes.map((c, i) => c[0] === "-" ? `без ${c.slice(1)} „${COFOG_NAMES[c.slice(1)]}“` : `${i ? "+ " : ""}${c} „${COFOG_NAMES[c]}“`).join(" ");

/* Графика: treemap по функции; клик разгъва функцията на подредовете ѝ. */
const TM_LINE = 16; // височина на ред в надписите на полетата, px
const tmMeasure = (() => {
  let cx = null;
  return s => { cx = cx || document.createElement("canvas").getContext("2d"); cx.font = "700 13px 'Sofia Sans Condensed', system-ui, sans-serif"; return cx.measureText(s).width; };
})();
// Побира ли се надписът „име + сума“ в поле w×h, без да се чупят думи?
function tmLabelFits(name, value, w, h) {
  const maxW = w - 14, words = name.split(/\s+/);
  if (Math.max(tmMeasure(value), ...words.map(tmMeasure)) > maxW) return false;
  const sp = tmMeasure(" ");
  let lines = 1, cur = 0;
  for (const wd of words) {
    const ww = tmMeasure(wd);
    if (!cur) cur = ww; else if (cur + sp + ww <= maxW) cur += sp + ww; else { lines++; cur = ww; }
  }
  return (lines + 1) * TM_LINE <= h - 10;
}
function drawTreemap() {
  const el = document.getElementById("treemap");
  const c = mkChart(el);
  const pal = [css("--data"), css("--data-2"), css("--accent"), css("--data-3"), css("--ok"), css("--warn"), css("--unk"), css("--muted"), css("--data-2")];
  tmPaint = () => {
    const f = FUNCTIONS[expSel];
    const open = expOpen && f.parts.length > 0;
    const items = open ? f.parts : FUNCTIONS;
    const valText = x => open ? mlnFmt(x.m) : fmt(x.m / 1000) + " млрд. €";
    const color = i => open ? pal[expSel % pal.length] : pal[i % pal.length]; // подредовете носят цвета на функцията
    const data = fit => items.map((x, i) => ({ name: x.short, value: x.m,
      label: { show: !fit || fit[x.short] !== false, color: textOn(color(i)) },
      itemStyle: { color: color(i), borderColor: !open && i === expSel ? css("--ink") : css("--surface") } }));
    c.setOption({
      tooltip: { formatter: p => { const x = items.find(it => it.short === p.name); return x ? `${x.name}<br><b>${mlnFmt(x.m)}</b>` : ""; } },
      series: [{ type: "treemap", roam: false, nodeClick: false, breadcrumb: { show: false }, width: "100%", height: "100%", top: 0, left: 0,
        label: { show: true, formatter: p => { const x = items.find(it => it.short === p.name); return x ? `${x.short}\n${valText(x)}` : p.name; }, fontFamily: "Sofia Sans Condensed, system-ui", fontWeight: 700, fontSize: 13, lineHeight: TM_LINE, overflow: "break", lineOverflow: "truncate" },
        itemStyle: { borderColor: css("--surface"), borderWidth: 3, gapWidth: 3 },
        data: data(null) }]
    }, true);
    // Втори пас: надпис само в полетата, където се побира цял; иначе думите се чупят на букви.
    // Сумите на скритите надписи остават в подсказката, в детайла и в таблицата.
    try {
      const fit = {};
      c.getModel().getSeriesByIndex(0).getViewRoot().children.forEach(n => {
        const x = items.find(it => it.short === n.name), l = n.getLayout();
        if (x && l) fit[x.short] = tmLabelFits(x.short, valText(x), l.width, l.height);
      });
      c.setOption({ series: [{ data: data(fit) }] });
    } catch (e) { /* без размерите оставяме всички надписи */ }
    el.setAttribute("aria-label", open ? `${f.name}: подредовете в таблицата по КФП, пропорционални на сумата` : "Разходи по функции, пропорционални на сумата");
    document.getElementById("crumbs").innerHTML = open
      ? `<button type="button" class="crumb" id="tmBack">← Всички функции</button><span class="crumb-here">${f.short} · ${fmt(f.v)} млрд. €</span>`
      : `<span class="muted">Всички функции · ${fmt(FUNC_TOTAL)} млрд. €</span>`;
    const back = document.getElementById("tmBack");
    if (back) back.onclick = () => { expOpen = false; tmPaint(); showDetail(); };
  };
  tmPaint();
  showDetail();
  // Размерите на надписите зависят от шрифта: пренареди, щом се зареди.
  if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => { if (!c.isDisposed()) tmPaint(); });
  // dataIndex в treemap брои и скрития корен (първото поле е 1), затова търсим по име.
  c.on("click", p => {
    if (expOpen && FUNCTIONS[expSel].parts.length) return; // под подредовете няма публикувано ниво (фаза 2)
    const k = FUNCTIONS.findIndex(f => f.short === p.name);
    if (k < 0) return;
    expSel = k; yrTotal = false; expOpen = FUNCTIONS[k].parts.length > 0;
    tmPaint(); showDetail();
  });
}

/* Таблица: функциите се разгъват на подредовете си. */
function expTableRows() {
  const row = (x, cls, first, id) => `<tr id="${id}" class="${cls}">${first}<td class="r">${mlnFmt(x.m)}</td><td class="r">${fmt(x.m / (FUNC_TOTAL * 1000) * 100)}%</td><td class="r">${ppFmt(x.m / 1000)} €</td><td class="r">${signPct(x.yoy)}</td></tr>`;
  return FUNCTIONS.map((f, i) => {
    const open = expRows.has(i);
    const name = f.parts.length
      ? `<button type="button" class="xbtn" data-row="${i}" aria-expanded="${open}"><span class="tw" aria-hidden="true">${open ? "▾" : "▸"}</span><span>${f.name}</span></button>`
      : `<span class="xpad">${f.name}</span>`;
    return row(f, "", `<td>${name}</td>`, `fr-${i}`) + (open ? f.parts.map((p, k) => row(p, "sub", `<td>${p.name}</td>`, `fr-${i}-${k}`)).join("") : "");
  }).join("");
}
function wireExpTable() {
  document.querySelectorAll("[data-row]").forEach(b => { b.onclick = () => {
    const i = +b.dataset.row;
    if (expRows.has(i)) expRows.delete(i); else expRows.add(i);
    expSel = i; yrTotal = false; expOpen = false;
    document.getElementById("expTbody").innerHTML = expTableRows();
    wireExpTable();
    const again = document.querySelector(`[data-row="${i}"]`);
    if (again) again.focus();
  }; });
}

/* По години: Eurostat COFOG за избраната функция + таблица с всички групи. */
function yearsHtml() {
  const f = FUNCTIONS[expSel];
  const codes = yrTotal ? ["TOTAL"] : f.cofog;
  const pct = yrUnit === "PC_GDP";
  const vals = cofogSeries(codes, yrUnit);
  const ys = COFOG.years, n = ys.length - 1;
  const show = v => pct ? `${fmt(v)}% от БВП` : mlnFmt(v);
  const d = vals[n] - vals[0];
  const chg = pct ? (Math.abs(d) < 0.05 ? "без промяна" : `${d > 0 ? "+" : "−"}${fmt(Math.abs(d))} пр.п.`) : signPct((vals[n] / vals[0] - 1) * 100);
  const label = yrTotal ? "Всички разходи" : f.name;
  const opts = FUNCTIONS.map((x, i) => `<option value="${i}">${x.short}</option>`).join("") + `<option value="-1">Всички разходи</option>`;
  const rows = FUNCTIONS.map((x, i) => ({ i, name: x.short, codes: x.cofog })).concat([{ i: -1, name: "Всички разходи", codes: ["TOTAL"] }]);
  const cell = v => pct ? fmt(v) : fmt0(v);
  const trs = rows.map(r => {
    const on = r.i < 0 ? yrTotal : !yrTotal && r.i === expSel;
    return `<tr class="${on ? "on" : ""}"><td><button type="button" class="linkish" data-yr="${r.i}">${r.name}</button></td><td class="muted" style="white-space:nowrap">${cofogCodes(r.codes)}</td>${cofogSeries(r.codes, yrUnit).map(v => `<td class="r">${cell(v)}</td>`).join("")}</tr>`;
  }).join("");
  return `
    <div class="yr-controls">
      <label for="yrSel" style="font-weight:600">Функция</label>
      <select id="yrSel" class="sel">${opts}</select>
      <div class="seg" role="group" aria-label="Мерна единица"><button type="button" id="uMio" aria-pressed="${!pct}">млн. €</button><button type="button" id="uPct" aria-pressed="${pct}">% от БВП</button></div>
    </div>
    <p class="yr-sum"><b>${label}</b>: ${show(vals[0])} през ${ys[0]} г. → <b>${show(vals[n])}</b> през ${ys[n]} г. (${chg}).</p>

function drawYears() {

  sel.onchange = () => pick(+sel.value);
  document.querySelectorAll("[data-yr]").forEach(b => { b.onclick = () => pick(+b.dataset.yr); });

  const pct = yrUnit === "PC_GDP";

  const c = mkChart(document.getElementById("yrChart"));
  c.setOption({
    grid: { left: 52, right: 24, top: 40, bottom: 32 },

    xAxis: { type: "category", data: COFOG.years.map(String), axisLabel: t, axisLine: { lineStyle: { color: css("--line") } } },
    yAxis: { type: "value", min: 0, name: pct ? "% от БВП" : "млн. €", nameTextStyle: t, axisLabel: { ...t, formatter: v => pct ? fmt(v, v % 1 ? 1 : 0) : fmt0(v) }, splitLine: { lineStyle: { color: css("--line") } } },
    series: [{ name: yrTotal ? "Всички разходи" : FUNCTIONS[expSel].short, type: "line", symbolSize: 8,
      lineStyle: { width: 3, color: css("--accent") }, itemStyle: { color: css("--accent") }, areaStyle: { color: css("--accent-soft") },

  });
}

function mRows() {
  const max = Math.max(...ZDB.map(m => m.exp || 0));
  const q = mQuery.trim().toLowerCase();
  return ZDB.filter(m => !q || m.name.toLowerCase().includes(q)).sort((a, b) => (b.exp || 0) - (a.exp || 0)).map(m => `
    <a class="mrow" href="#/vedomstvo/${m.art}"><span><span class="nm">${cap(m.name)}</span> <span class="tag">чл. ${m.art}${m.items.length ? " · " + m.items.filter(i => !i.n.includes(".")).length + " политики/програми" : ""}</span></span><span class="amt">${money(m.exp || 0)}</span><span class="hbar"><i style="width:${(m.exp || 0) / max * 100}%"></i></span></a>`).join("") || `<p class="muted" style="padding:12px 4px">Няма резултат за „${escapeHtml(mQuery)}“.</p>`;
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// #/vedomstvo/11 — бюджетът по чл. 11; #/vedomstvo/11/z2 — третият ред в „За какво харчи“ (по закона);

// Съставните бюджети в КФП (COMP): план за 2026 г. по законите и АСБП; национален бюджет и европейски средства към 31.07.
function compHtml() {
  const C = COMP, bk = x => fmt(x / 1e6, 2), bm = x => fmt(x / 1000, 2); // хил. € / млн. € → млрд. €
  const tr = [
    ["Държавен бюджет", bk(C.sb.rev), "—", `${bk(C.sb.exp)}<div class="psub">и ${bk(C.sb.eu)} вноска в ЕС</div>`],
    ["Държавно обществено осигуряване (НОИ)", bk(C.doo.own), bk(C.doo.tr), bk(C.doo.exp)],
    ["Здравна каса (НЗОК)", bk(C.nzok.own), bk(C.nzok.tr), bk(C.nzok.exp)],
    ["Общините", "—", bk(C.mun.tr), bm(C.mun.expMln)],
    ["Сметки за средства от ЕС", bm(C.eu.rev), bm(C.eu.tr), bm(C.eu.exp)],
    ["БАН и държавните висши училища", "—", `${bk(C.ban)}<div class="psub">чрез бюджета на МОН</div>`, "—"]
  ].map(([n, a, b, c]) => `<tr><td>${n}</td><td class="r">${a}</td><td class="r">${b}</td><td class="r">${c}</td></tr>`).join("");
  const N = C.nve, row = (lab, k) => {
    const p = N.plan[k], j = N.jul[k];
    return `<tr><td>${lab}</td><td class="r">${bm(p.rev)}</td><td class="r">${bm(j.rev)}<div class="psub">${fmt(j.rev / p.rev * 100)}%</div></td><td class="r">${bm(p.exp_incl_eu_contribution)}</td><td class="r">${bm(j.exp_incl_eu_contribution)}<div class="psub">${fmt(j.exp_incl_eu_contribution / p.exp_incl_eu_contribution * 100)}%</div></td></tr>`;
  };
  return `
  <section class="panel" id="ix-komp">${src("components")}
    <div class="panel-head"><h2>Кой какво събира и харчи</h2>${stPill("components")}</div>
