title = "СИГМА Бюджет secret scan"
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Reviewed 2026-11-11: public fiscal period identifiers, not credentials; exact secret values only."
regexTarget = "secret"
regexes = ['''^202[89]\.forecast$''']

[[rules.allowlists]]
description = "Reviewed 2026-11-11: SHA-256 donor/source checksums in frozen provenance/capture evidence only."
condition = "AND"
paths = ['''packages/ingest/test/fixtures/(validate14/code-path-capture|validate15/compound/provenance|validate17a/provenance|validate15/oracle|wave13b/proof)\.json$''']
regexTarget = "secret"
regexes = [
  '''^067ec3d25c048a350bdd714bb50051d99d7ee9e52fe522cd9fb3da18490c9e55$''',
  '''^17027fde77aca05a509e944165b18ebbaaa5faed6be39a90a262d6f44187d09b$''',
  '''^31d9ca115482fa3c86908bddf8f6ffb2b1233c3c55b21f91a528e08f89ac5bff$''',
  '''^3cabc81d6a6a46405de750311e5cc217848f11ceddc7d85860420367dfe064e0$''',
  '''^6a626fd0dd4f75c6b62dab1d4d1fa98a68ceeafa582dedf1f660dd96ed5ce016$''',
  '''^73d256093f2a423017edf85b671cf315f469370c94c4fcd7481aa0505061310a$''',
  '''^b591273f86484cda2363f7f8d0d39b7436480e42d4c530570a51a6d763955f94$''',
