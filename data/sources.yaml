sources:
- id: kfp
  title: 'Консолидирана фискална програма (КФП): месечна информация за изпълнението'
  publisher: Министерство на финансите
  page: https://www.minfin.bg/bg/statistics/5
  access: browser-only
  acquisition: import
  format: xls
  parser: python -m budget_pipeline.extract.kfp_full
  period: monthly from January 2024, cumulative since 1 January (the newest is `latest` in data/release/execution.json)
  unit: млн. лв. (2024–2025), млн. € (2026)
  live: false
  files:
  - path: data/originals/kfp_2024/*.xls
    title: 12 monthly reports for 2024
  - path: data/originals/kfp_2025/*.xls
    title: 12 monthly reports for 2025 (December is _4)
  - path: data/originals/kfp_2026/*.xls
    title: monthly reports for 2026
  limitations:
  - 'minfin.bg answers 403 to automatic requests: every report is downloaded by a person and imported with python -m budget_pipeline.sources.originals
    import, which checks the sheet, the period and the unit'
  - the MF release of 02.11.2026 uses a September 2025 base 0.9 млн. € above the archived report (docs/data-sources.md, section 4.1)
- id: asbp
  title: 'Мотиви към законопроекта за държавния бюджет 2026: актуализирана средносрочна бюджетна прогноза (АСБП) 2026–2028'
  publisher: Министерство на финансите
  page: https://www.minfin.bg/bg/legislation1/609
  access: browser-only
  acquisition: import
  format: pdf
  parser: python -m budget_pipeline.extract.asbp_tables, python -m budget_pipeline.extract.asbp_pages
  period: 2024–2028 (report 2024, expected 2025, plan 2026, forecast 2027–2028)
  unit: млн. € and % of GDP
  live: false
  files:
  - path: data/originals/asbp/UMTBF-2026-2028-motivi.pdf
    title: Мотиви и АСБП 2026–2028, PDF of the MF
  - path: data/originals/asbp/UMTBF-2026-2028-motivi.source.json
    title: acquisition record of the PDF (who supplied it, from where, when)
    acquired: '2026-11-08'
  limitations:
  - the acquisition record UMTBF-2026-2028-motivi.source.json is pinned but not on the machines checked on 05.11.2026
  - a second version of the tables is in the bill (parliament 52-602-01-19.docx); the two differ in small rows, at most 4.3 млн. € (docs/data-sources.md,
    section 4.2)
