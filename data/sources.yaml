  - network
  reproducible: false
  note: Acquisition manifest retained from the audit, extended by fresh DV/SEBRA downloads and observed minfin 403 probes on 2026-11-08.
    Historical missing manifest is not reconstructed.
  acquired: '2026-11-08'
