# Dataset registry (docs/approach-specification.md, section 4): every file of data/release, with the files the published catalog does not
# list and the pending sets that have no file yet. Checked by `python pipeline/budget_pipeline/validate/registry.py check` (CI).
#
# datasets[]      id = the slug in catalog.json (sebra and dbp2027 are not in the catalog)
#   catalogId     the dataset id of catalog.json (D01 …, M06, P01 …); several files can share one
#   status        real | mock | pending, as catalog.json says; a pending set has `reason` and `expected` instead of files
#   files         the paths in data/release (a glob for the 42 ministry files)
#   producer      the script (and builder function) that writes it
#   layers        the v5/v6 steps of pipeline/budget_pipeline/build/rebuild.py that change it after the producer
#   inputs        source ids (data/sources.yaml), intermediate paths, or ids of other datasets
#   schema        the document with its data contract
#   screens, period, unit   as catalog.json says (the checker compares them)
#   scope         which budget or sector the numbers cover
#   rebuild       the command that rebuilds it from the pinned inputs; `checked` is the date it gave the file byte for byte,
#                 `notRebuilt` says why there is no such command
#   limitations   what is known to be missing or weak
schema: 1
datasets:
- id: outlook
  catalogId: D01
