# Checks, build and deployment of the site (README „Сглобяване и публикуване“; docs/adr/0002-react-router-ssr.md).
#   pull request to main             -> the registries, data validation, the TypeScript check, the build of the Worker (React Router SSR)
#                                       with every screen checked as the server sends it and as the browser shows it, the browser checks of the
#                                       app (screens against the built Worker), a build of the pinned data image, and the release
#                                       registry on a local Worker (stage C)
#   push to main                     -> the same, then deploy the built Worker to staging (noindex)
# There is no develop branch. This workflow never deploys to production: production comes later, by hand (docs/production-procedure.md).
# The staging deployment needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and the variable STAGING_ORIGIN
# (the staging Worker's address). Without the secrets the deploy step is skipped; with them but without STAGING_ORIGIN it fails, because
# the compatibility check of the code against the current release (tests/release/compat_check.py) needs that address.
name: site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-dev.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install tools
        run: |
          python -m pip install --require-hashes -r tests/requirements-dev.lock -r pipeline/requirements.lock
          python -m pip install --no-deps -e pipeline
          python -m playwright install --with-deps chromium
          pnpm install --frozen-lockfile
      - name: Check web formatting
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: TypeScript tests
        run: pnpm test
      - name: Warn when the monthly КФП report is overdue (never fails)
        run: |
          pnpm --filter @sigma-budget/etl... build
          pnpm exec budget-ts freshness
      - name: Check the source and dataset registries
        run: python -m budget_pipeline.validate.registry check
      - name: Check the unchanged historical Python publication against its manifest
        run: ./budget-python validate --site
      - name: Validate the data
        run: python -m budget_pipeline.validate.datasets
      - name: Check frozen 2027 budget extractions
        run: |
          python -m unittest discover -s tests/pipeline -t .
          python -m budget_pipeline.extract.budget_forecast_2027 --check
          python -m budget_pipeline.extract.budget_bill_2027 --check
      - name: Compatibility of code and data (stage E)
        run: python -m tests.release.compat_check
      - name: The query each screen is drawn and cached by (apps/web/client/routes.js)
        run: python -m apps.web.scripts.query_check
      - name: Build the Worker for staging and check every screen
        env:
          ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://sigma-budget.my-data.bg' }}
        run: python -m apps.web.scripts.build --env staging --origin "$ORIGIN" --noindex
      - name: The checks and the build leave data/release unchanged
        run: test -z "$(git status --porcelain -- data/release)" || { git status --short -- data/release; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: apps/web/build
          retention-days: 7

  check:
    # The browser checks of the app (hash mode, the expected figures read from data/release/execution.json): all of them block, and the
    # staging deployment waits for them. The full screens also covers 400 px and keyboard paths; it runs against the built Worker
    # (the screens drawn on the server, then taken over by the app), the others test the app on the composed static site in tmp/.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tmp/pw-browsers # the checks look there first (redirects and others set it as their default)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-dev.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: |
          python -m pip install --require-hashes -r tests/requirements-dev.lock -r pipeline/requirements.lock
          python -m pip install --no-deps -e pipeline
          python -m playwright install --with-deps chromium
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: apps/web/build
      - name: Screens, accessibility and layout (against the built Worker)
        run: |
          pnpm exec wrangler dev -c apps/web/build/server/wrangler.json --ip 127.0.0.1 --port 8814 --persist-to "$RUNNER_TEMP/state" > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8814/robots.txt && break; sleep 1; done
          python -m tests.e2e.screens --url http://127.0.0.1:8814/
          python -m tests.e2e.visual_audit --url http://127.0.0.1:8814/
          python -m tests.e2e.narrative_adoption --url http://127.0.0.1:8814/
      - name: Annual periods, aliases, SSR notices and stored preferences
        run: python -m tests.e2e.period_matrix --url http://127.0.0.1:8814/
      - name: Old addresses
        run: python -m tests.e2e.redirects
      - name: Tax calculator
        run: python -m tests.e2e.calc_check
      - name: Sharing and export
        run: python -m tests.e2e.share_check
      - name: Acceptance figures
        run: python -m tests.e2e.accept
      - name: Motion
        run: python -m tests.e2e.motion

  release:
    # the release registry and the operator API (stage C) on the Worker with local D1 and R2: acceptance scenarios 3, 4, 5, 6 and 9, rollback
    # and the public API, with synthetic releases (tests/release/release_check.py; docs/release.md); the restore drill of scenario 10
    # (tests/release/restore_drill.py; docs/operator-guide.md)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m pip install --require-hashes -r tests/requirements-dev.lock -r pipeline/requirements.lock
          python -m pip install --no-deps -e pipeline
      - run: python -m tests.release.release_check
      - run: python -m tests.release.restore_drill

  data-image:
    # the pinned environment of the data processing (pipeline/Dockerfile): it must build from its digest and hash-locked
    # dependencies. Running it needs the raw files: the ones from minfin.bg are in the repository, the rest are downloaded
    # (docs/data-sources.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sigma-budget-data pipeline
      - run: docker run --rm -v "$PWD":/repo:ro sigma-budget-data python -m budget_pipeline.environment

  deploy:
    needs: [build, check, release, common-parity, node-import]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: apps/web/build
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      # the wrangler of pnpm-lock.yaml, the one release_check tests with
      - run: pnpm install --frozen-lockfile
      - name: Deploy to the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set: skipping the deployment."
            exit 0
          fi
          # the new code must read the release that is current on staging (tests/release/compat_check.py; no release yet passes). Without the
          # address that check cannot run, and the code is not deployed unchecked
          if [ -z "$STAGING_ORIGIN" ]; then
            echo "::error::The variable STAGING_ORIGIN is not set: the compatibility check cannot run, so nothing is deployed."
            exit 1
          fi
          python3 -m tests.release.compat_check --env-url "$STAGING_ORIGIN"
          pnpm exec wrangler deploy -c apps/web/build/server/wrangler.json      # built with CLOUDFLARE_ENV=staging: the staging Worker, D1 and R2

  validation-wave14:
    # Frozen Python evidence and the independent scoped TypeScript checks. No live release oracle.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: |
          python -m pip install --require-hashes -r pipeline/requirements.lock
          pnpm install --frozen-lockfile
          pnpm --filter @sigma-budget/ingest... build
      - name: Verify frozen Python oracle and provenance
        run: |
          python packages/ingest/test/fixtures/validate14/generate_oracle.py --check
          python packages/ingest/test/fixtures/validate14/generate_groups_oracle.py --check
          python packages/ingest/test/fixtures/validate17a/gzip-cache/generate_oracle.py --check
      - name: Scoped validation and corrupted corpus parity
        env:
          WAVE14_PARITY_REPORT: tmp/ts-migration/candidates/14/report.json
        run: pnpm --filter @sigma-budget/ingest exec vitest run src/validate/execution-contract.test.ts src/validate/groups.test.ts src/validate/helpers.test.ts src/validate/gzip-cache.test.ts src/validate/safety.test.ts src/validate/registry-report.test.ts src/validate/json-error.test.ts src/validate/route-catalogue.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-wave14-parity
          path: tmp/ts-migration/candidates/14/report.json
          if-no-files-found: error
      - name: Release remains unchanged
        if: always()
        run: git diff --exit-code -- data/release

  validation-wave15:
    # Frozen 810 donor corpus; no source refresh or live-release comparison.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: |
          python -m pip install --require-hashes -r pipeline/requirements.lock
          pnpm install --frozen-lockfile
          pnpm --filter @sigma-budget/ingest... build
          pnpm --filter @sigma-budget/ingest typecheck
      - name: Verify frozen donor oracles
        run: |
          python packages/ingest/test/fixtures/validate14/generate_oracle.py --check
          python packages/ingest/test/fixtures/validate14/generate_groups_oracle.py --check
          python packages/ingest/test/fixtures/validate15/generate_oracle.py --check
          python packages/ingest/test/fixtures/validate15/generate_unicode.py --check
          python packages/ingest/test/fixtures/validate15/compound/generate_oracle.py --check
          python packages/ingest/test/fixtures/validate15/native/generate_oracle.py --check
          python packages/ingest/test/fixtures/validate15/iterable/generate_oracle.py --check
      - name: Fiscal and legal validation parity
        env:
          WAVE15_PARITY_REPORT: tmp/ts-migration/candidates/15/report.json
          WAVE15_COMPOUND_REPORT: tmp/ts-migration/candidates/15/compound-report.json
          WAVE15_NATIVE_REPORT: tmp/ts-migration/candidates/15/native-report.json
          WAVE15_ITERABLE_REPORT: tmp/ts-migration/candidates/15/iterable-report.json
        run: pnpm --filter @sigma-budget/ingest exec vitest run src/validate/wave15-parity.test.ts src/validate/wave15-sum.test.ts src/validate/wave15-unicode.test.ts src/validate/wave15-compound.test.ts src/validate/wave15-native.test.ts src/validate/wave15-iterable.test.ts src/validate/ordered-json.test.ts src/validate/cli15.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-wave15-parity
          path: |
            tmp/ts-migration/candidates/15/report.json
            tmp/ts-migration/candidates/15/compound-report.json
            tmp/ts-migration/candidates/15/native-report.json
            tmp/ts-migration/candidates/15/iterable-report.json
          if-no-files-found: error
      - name: Release remains unchanged
        if: always()
        run: git diff --exit-code -- data/release

  validation-wave17a:
    # Offline donor evidence; production Python validation remains authoritative.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate frozen Python results
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import subprocess
          import sys

          proofs = [
              ["packages/ingest/test/fixtures/validate17a/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/generate_oracle.py", "--extra", "--check"],
              ["packages/ingest/test/fixtures/validate17a/review/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/key-whitespace/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/integer/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/integer-limit/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/reader/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/boundaries/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/containers/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/iterators/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/catalog-semantics/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/short-circuit/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/membership/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/year-keys/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/source-strings/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/gzip-cache/generate_oracle.py", "--check"],
              ["packages/ingest/test/fixtures/validate17a/wrapper/generate.py", "--check"],
          ]
          assert len(proofs) == 17 and len({tuple(args) for args in proofs}) == 17
          assert all(args[-1] == '--check' for args in proofs)

          def verify(args):
              print('VERIFY', *args, flush=True)
              result = subprocess.run([sys.executable, *args], check=False)
              print('PASS' if result.returncode == 0 else 'FAIL', *args, flush=True)
              return result.returncode

          with ThreadPoolExecutor(max_workers=2) as pool:
              exits = list(pool.map(verify, proofs))
          raise SystemExit(1 if any(exits) else 0)
          PY
      - run: pnpm --filter @sigma-budget/ingest... build
      - name: Scoped differential and CLI safety tests
        env:
          WAVE17A_PARITY_REPORT: tmp/ts-migration/candidates/17a/report.json
        run: pnpm --filter @sigma-budget/ingest exec vitest run src/validate/catalog.test.ts src/validate/catalog-integer.test.ts src/validate/catalog-order.test.ts src/validate/route-catalogue.test.ts src/validate/cli17a.test.ts src/validate/json-error.test.ts src/validate/registry-report.test.ts src/validate/gzip-cache.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-wave17a-parity
          path: tmp/ts-migration/candidates/17a/report.json
          if-no-files-found: error
      - name: Release remains unchanged
        if: always()
        run: git diff --exit-code -- data/release

  common-parity:
    # Offline common-layer translation against Python-produced frozen evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Common layer and Python parity
        env:
          COMMON_PARITY_REPORT: ${{ github.workspace }}/tmp/ts-migration/candidates/02/diff.json
        run: pnpm --filter @sigma-budget/ingest exec vitest run src/common/common.test.ts
      - name: Law builder and frozen Python parity
        env:
          LAW_PARITY_REPORT: ${{ github.workspace }}/tmp/ts-migration/candidates/04/diff.json
          PYTHONPATH: pipeline
        run: |
          python packages/ingest/test/fixtures/law/generate_oracle.py --check
          pnpm --filter @sigma-budget/ingest exec vitest run src/build/law-evidence.test.ts src/build/law-articles.test.ts src/build/law-changes.test.ts src/build/law.test.ts
      - name: Editorial builder and frozen Python parity
        env:
          EDITORIAL_PARITY_REPORT: ${{ github.workspace }}/tmp/ts-migration/candidates/08/diff.json
          PYTHONPATH: pipeline
        run: |
          python3 packages/ingest/test/fixtures/editorial/generate_oracle.py --check
          pnpm --filter @sigma-budget/ingest exec vitest run src/build/editorial.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-parity
          path: tmp/ts-migration/candidates/08/diff.json
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - name: Verify programme oracle regeneration
        run: |
          python -m pip install --require-hashes -r pipeline/requirements.lock
          PYTHONPATH=pipeline python packages/ingest/test/fixtures/programmes/generate_oracle.py --check
      - name: Verify components and rates frozen Python evidence
        run: PYTHONPATH=pipeline python packages/ingest/test/fixtures/components-rates/generate_oracle.py --check
      - name: Components and rates frozen Python parity
        env:
          COMPONENTS_RATES_PARITY_REPORT: ${{ github.workspace }}/tmp/ts-migration/candidates/06/diff.json
        run: pnpm --filter @sigma-budget/ingest exec vitest run src/build/components-rates.test.ts src/build/components.test.ts src/build/components-social.test.ts src/build/components-tables.test.ts src/build/rates.test.ts src/build/rates-sources.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: components-rates-parity
          path: tmp/ts-migration/candidates/06/diff.json
          if-no-files-found: error
      - name: Debt and local finance frozen Python oracle and parity
        run: |
          python packages/ingest/test/fixtures/debt-local/generate_oracle.py --check
          python packages/ingest/test/fixtures/debt-local/test_readers.py
          pnpm --filter @sigma-budget/etl... build
          pnpm --filter @sigma-budget/ingest exec vitest run src/build/debt.test.ts src/build/municipalities.test.ts src/build/sebra.test.ts
          pnpm --filter @sigma-budget/etl exec vitest run src/debt-local-build.test.ts
          pnpm exec budget-ts build --inputs packages/ingest/test/fixtures/debt-local --out tmp/ts-migration/candidates/07 --scope debt,municipalities,geo-obshtini,sebra --build-date 2026-11-08
          for stage in donor projected published; do
            pnpm exec budget-ts parity --registry packages/ingest/test/fixtures/debt-local/registry.yaml --oracle packages/ingest/test/fixtures/debt-local/$stage --candidate tmp/ts-migration/candidates/07/data --scope debt,municipalities,geo-obshtini,sebra --policy packages/ingest/test/fixtures/debt-local/policy.json --report tmp/ts-migration/candidates/07/$stage-diff.json
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debt-local-parity
          path: tmp/ts-migration/candidates/07/*-diff.json
          if-no-files-found: error
      - name: Budgets and programmes frozen Python parity
        env:
          PROGRAMMES_PARITY_REPORT: ${{ github.workspace }}/tmp/ts-migration/candidates/05/diff.json
        run: pnpm --filter @sigma-budget/ingest exec vitest run src/build/budgets.test.ts
      - name: DBP and GVA frozen evidence and scoped proof
        run: |
          python packages/ingest/test/fixtures/dbp-gva/generate_oracle.py --check
          pnpm --filter @sigma-budget/etl... build
          pnpm --filter @sigma-budget/ingest exec vitest run src/build/dbp-gva.test.ts
          pnpm --filter @sigma-budget/etl exec vitest run src/dbp-gva-build.test.ts
          pnpm exec budget-ts build --inputs packages/ingest/test/fixtures/dbp-gva --out tmp/ts-migration/candidates/10 --scope dbp2027,gva-sectors --build-date 2026-11-08
          pnpm exec budget-ts parity --registry packages/ingest/test/fixtures/dbp-gva/datasets.yaml --oracle packages/ingest/test/fixtures/dbp-gva/published --candidate tmp/ts-migration/candidates/10/data --scope dbp2027 --policy packages/ingest/test/fixtures/dbp-gva/policy.json --report tmp/ts-migration/candidates/10/dbp-parity.json
          git diff --exit-code -- data/release
      - uses: actions/upload-artifact@v4
        with:
          name: dbp-gva-proof
          path: |
            tmp/ts-migration/candidates/10/proof-report.json
            tmp/ts-migration/candidates/10/dbp-parity.json
      - name: Fiscal frozen Python oracle and parity
        env:
          PYTHONPATH: pipeline
          FISCAL_PARITY_REPORT: ${{ github.workspace }}/tmp/ts-migration/candidates/candidate03/diff.json
        run: |
          python packages/ingest/test/fixtures/fiscal/generate_oracle.py --check
          python packages/ingest/test/fixtures/fiscal/generate_datasets.py --check
          pnpm --filter @sigma-budget/etl... build
          pnpm --filter @sigma-budget/ingest exec vitest run src/build/fiscal.test.ts src/build/fiscal-annual.test.ts src/build/fiscal-build.test.ts src/build/measures.test.ts src/build/debt-text.test.ts
          pnpm --filter @sigma-budget/etl exec vitest run src/fiscal-build.test.ts
          pnpm exec budget-ts build --inputs packages/ingest/test/fixtures/fiscal --out tmp/ts-migration/candidates/candidate03 --scope outlook,revenue,expenditure,measures --build-date 2026-11-08
          pnpm exec budget-ts parity --registry packages/ingest/test/fixtures/fiscal/inputs/datasets.yaml --oracle packages/ingest/test/fixtures/fiscal/oracle --candidate tmp/ts-migration/candidates/candidate03/data --scope outlook,revenue,expenditure,measures --policy packages/ingest/test/fixtures/fiscal/policy.json --report tmp/ts-migration/candidates/candidate03/cli-diff.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscal-parity
          path: |
            tmp/ts-migration/candidates/candidate03/diff.json
            tmp/ts-migration/candidates/candidate03/cli-diff.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programmes-parity
          path: tmp/ts-migration/candidates/05/diff.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
