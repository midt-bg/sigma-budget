  node-inputs:
    # Draft assets need push access. This job runs no checkout or project code;
    # the token is exposed only to the fixed download, then all bytes are pinned.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download only the approved repository-owned CI archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --hostname github.com repos/midt-bg/sigma-budget/releases/assets/733218674 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/registered-node-inputs.tar.gz"
          printf '%s  %s\n' '8617be55dad2d9605ac1c83876685d68650ecd3b709b4066ea8b018dd416090e' "$RUNNER_TEMP/registered-node-inputs.tar.gz" | sha256sum --check
          test "$(stat -c '%s' "$RUNNER_TEMP/registered-node-inputs.tar.gz")" = 151787132
      - uses: actions/upload-artifact@v4
        with:
          name: registered-node-input-archive
          path: ${{ runner.temp }}/registered-node-inputs.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  node-import:
    # Required actual-source acceptance. A missing restored snapshot fails; no core acceptance skip.
    needs: [node-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sigma-budget/etl... build
      - uses: actions/download-artifact@v4
        with:
          name: registered-node-input-archive
          path: ${{ runner.temp }}/registered-node-input-archive
      - name: Authenticate the reviewed archive and every registered input
        run: node scripts/restore-node-input-cache.mjs "$RUNNER_TEMP/registered-node-input-archive/registered-node-inputs.tar.gz" "$RUNNER_TEMP/registered-node-inputs"
      - name: Actual Node readers, complete rules, double build and local recorded-code replay
        run: node scripts/node-import-acceptance.mjs "$RUNNER_TEMP/registered-node-inputs" "$RUNNER_TEMP/node-acceptance" 2026-11-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision the existing locked browser test tool (outside import runtime)
        run: |
          python -m pip install --require-hashes -r tests/requirements-dev.lock
          python -m playwright install --with-deps chromium
      - name: Package the fresh Node candidate and exercise its Worker and browser identity
        run: node scripts/node-candidate-site-acceptance.mjs "$RUNNER_TEMP/node-acceptance/candidate" "$RUNNER_TEMP/node-site"
      - name: Protected checkout state
        if: always()
        run: test -z "$(git status --porcelain -- data packages/ingest/test/fixtures tests/pipeline/fixtures)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-import-acceptance
          path: |
            ${{ runner.temp }}/node-acceptance/acceptance.json
            ${{ runner.temp }}/node-acceptance/candidate/manifest.json
            ${{ runner.temp }}/node-acceptance/candidate/validation.json
            ${{ runner.temp }}/node-acceptance/candidate/receipt.json
            ${{ runner.temp }}/node-site/site-acceptance.json
          if-no-files-found: error
