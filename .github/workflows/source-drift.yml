name: Automatic source drift
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sigma-budget/etl... build
      - name: Acquire in a disposable directory and compare pins
        run: pnpm exec budget-ts collect --out "$RUNNER_TEMP/acquisition" --check-drift --summary "$RUNNER_TEMP/drift.md"
      - name: Report drift and unavailable sources
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/drift.md" ]; then
            cat "$RUNNER_TEMP/drift.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Acquisition leaves the checkout unchanged
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=normal)"
