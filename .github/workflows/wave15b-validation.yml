name: wave15b-validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: |
          python -m pip install --require-hashes -r pipeline/requirements.lock
          pnpm install --frozen-lockfile
          pnpm --filter @sigma-budget/ingest... build
      - name: Frozen Python donor and physical pages
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python packages/ingest/test/fixtures/validate15b/generate_oracle.py --check
          python packages/ingest/test/fixtures/validate15b/generate_helpers.py --check
          python packages/ingest/test/fixtures/validate15b/audit_pdf.py --check
          python packages/ingest/test/fixtures/validate15b/source_order.py --check
          python packages/ingest/test/fixtures/validate15b/source_methods.py --check
          python packages/ingest/test/fixtures/validate15b/optional_values.py --check
      - name: Differential and report safety tests
        run: pnpm --filter @sigma-budget/ingest exec vitest run src/validate/budget-2027.test.ts src/validate/budget-2027-order.test.ts src/validate/budget-2027-methods.test.ts src/validate/budget-2027-optional.test.ts
