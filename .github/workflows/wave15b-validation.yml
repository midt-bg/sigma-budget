name: wave15b-validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - run: python -m pip install --require-hashes -r pipeline/requirements.lock
      - name: Frozen Python donor and physical pages
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python packages/ingest/test/fixtures/validate15b/generate_oracle.py --check
          python packages/ingest/test/fixtures/validate15b/generate_helpers.py --check
          python packages/ingest/test/fixtures/validate15b/audit_pdf.py --check
          python packages/ingest/test/fixtures/validate15b/source_order.py --check
          python packages/ingest/test/fixtures/validate15b/source_methods.py --check
          python packages/ingest/test/fixtures/validate15b/optional_values.py --check
