name: security
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  semgrep:
    env:
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    runs-on: ubuntu-latest
    # Cap the job so a hung rule fetch or a runaway scan can't sit until GitHub's default runner
    # limit. 15m is a generous ceiling — local scans complete in under a minute.
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Static analysis (semgrep)
        run: |
          semgrep scan --config .semgrep/security.yml --metrics=off --error --strict
          python scripts/security-scanner-check.py semgrep semgrep

  dependencies-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.30.1'
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the upstream release checksums.txt
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
          python3 scripts/security-scanner-check.py gitleaks "$RUNNER_TEMP/gitleaks"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dependency advisory gate (all severities)
        run: pnpm audit --audit-level=low
